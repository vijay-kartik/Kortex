android.useAndroidX=true
kotlin.code.style=official
# AGP 8.7.3 was validated up to compileSdk 35; 36 compiles fine, so silence the warning.
android.suppressUnsupportedCompileSdk=36
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true

# Published coordinates for the Tether SDK (space.pitchstone:tether-core / tether-ui).
# One source of truth so the two artifacts never drift apart.
tether.version=0.1.0
# GitHub Packages credentials. Keep real values out of VCS - set them in
# ~/.gradle/gradle.properties, or via the GITHUB_ACTOR / GITHUB_TOKEN environment variables.
# The token needs the write:packages scope.
# gpr.user=
# gpr.key=
